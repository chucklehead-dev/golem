# A sample of how Argo CD installs golem (docs/operations.md §1): fill in
# the repository URLs, the account's role ARNs and the sites, and apply to
# the Argo CD namespace.
#
# Upgrades: the gateway pools first, then golem-control. A gateway decodes
# snapshots strictly (a member it does not know is refused), so a
# publisher that adds a member must find every gateway able to read it:
# the sync waves order them when these are synced by an app of apps
# (gateways wave 0, golem-control wave 1); synced directly, sync and roll
# out every pool before golem-control. The first install is the other way
# round (docs/operations.md, First install): golem-control publishes
# first, else the new gateways have nothing to serve.
#
# The config repository is not an Application: nothing in the cluster
# reads config objects (ADR 0054). golem-control's git-sync checks it out
# and golem-control compiles it; syncing it into the cluster would make a
# second copy that is not the one published. For the same reason the
# chart's CRDs are skipped (skipCrds): they are kept generated for a later
# CRD watch, and installed by nothing in M1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golem-control
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/chucklehead-dev/golem.git
    targetRevision: main
    path: deploy/charts/golem-control
    helm:
      skipCrds: true
      valuesObject:
        bucket: s3://golem-state/golem/
        signingKey: kms:arn:aws:kms:us-east-2:123456789012:key/REPLACE
        config:
          repo: git@github.com:corp/golem-config.git
        api:
          entraTenant: REPLACE
        clickhouse:
          url: https://clickhouse.golem.svc:8443
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/golem-control
  destination:
    server: https://kubernetes.default.svc
    namespace: golem
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# One gateway pool per site. The emergency denylist ConfigMap is managed
# outside Argo (docs/operations.md §2) and so is not in the chart: create it
# once per namespace.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: golem-gateway
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - {site: us-east-2, pool: internal, valkey: "master.golem-valkey.REPLACE.use2.cache.amazonaws.com:6379", role: "arn:aws:iam::123456789012:role/golem-gateway-internal"}
  template:
    metadata:
      name: "golem-gateway-{{.pool}}-{{.site}}"
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      source:
        repoURL: https://github.com/chucklehead-dev/golem.git
        targetRevision: main
        path: deploy/charts/golem-gateway
        helm:
          valuesObject:
            pool: "{{.pool}}"
            site: "{{.site}}"
            bucket: s3://golem-state/golem/
            valkey: {address: "{{.valkey}}"}
            # The pod's collector writes the ledger here (its config is
            # deploy/otel/collector.yaml, docs/operations.md First install).
            collector:
              clickhouse: {endpoint: "https://clickhouse.golem.svc:8443"}
            providerSecrets: [anthropic]
            serviceAccount:
              annotations:
                eks.amazonaws.com/role-arn: "{{.role}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: golem
      syncPolicy:
        automated: {prune: true, selfHeal: true}
