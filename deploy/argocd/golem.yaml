# A sample of how Argo CD installs golem (docs/operations.md §1): fill in
# the repository URLs, the account's role ARNs and the sites, and apply to
# the Argo CD namespace. golem-control first (with the CRDs), then a
# gateway pool per site: the sync waves order them when these are synced by
# an app of apps; synced directly, sync golem-control first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golem-control
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/chucklehead-dev/golem.git
    targetRevision: main
    path: deploy/charts/golem-control
    helm:
      valuesObject:
        bucket: s3://golem-state/golem/
        signingKey: kms:arn:aws:kms:us-east-2:123456789012:key/REPLACE
        config:
          repo: git@github.com:corp/golem-config.git
        api:
          entraTenant: REPLACE
        clickhouse:
          url: https://clickhouse.golem.svc:8443
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/golem-control
  destination:
    server: https://kubernetes.default.svc
    namespace: golem
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# One gateway pool per site. The emergency denylist ConfigMap is managed
# outside Argo (docs/operations.md §2) and so is not in the chart: create it
# once per namespace.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: golem-gateway
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - {site: us-east-2, pool: internal, valkey: "master.golem-valkey.REPLACE.use2.cache.amazonaws.com:6379", role: "arn:aws:iam::123456789012:role/golem-gateway-internal"}
  template:
    metadata:
      name: "golem-gateway-{{.pool}}-{{.site}}"
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      source:
        repoURL: https://github.com/chucklehead-dev/golem.git
        targetRevision: main
        path: deploy/charts/golem-gateway
        helm:
          valuesObject:
            pool: "{{.pool}}"
            site: "{{.site}}"
            bucket: s3://golem-state/golem/
            valkey: {address: "{{.valkey}}"}
            providerSecrets: [anthropic]
            serviceAccount:
              annotations:
                eks.amazonaws.com/role-arn: "{{.role}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: golem
      syncPolicy:
        automated: {prune: true, selfHeal: true}
