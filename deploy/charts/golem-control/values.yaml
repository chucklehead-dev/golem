# golem-control: one installation (docs/operations.md §1), one replica
# (ADR 0053): it claims the state document's fence as it starts. The
# Deployment is replaced with Recreate; a lingering predecessor is refused
# at its next fenced write and exits.

image:
  repository: ghcr.io/chucklehead-dev/golem-control
  tag: ""          # default: the chart's appVersion
  pullPolicy: IfNotPresent

# The state bucket, the publishing key (KMS), and the pools published to.
bucket: ""         # required: s3://<bucket>/<prefix>
signingKey: ""     # required: kms:<a KMS key ARN, ECC_NIST_P256>
trustedKeys:       # retiring publishing keys' public halves, while rotating
  configMap: ""
pools: [internal]
# MUST MATCH every gateway pool's chart: lease is at most the gateways'
# maxLease (-max-lease), or they refuse every snapshot and serve until the
# lease they hold runs out (raise maxLease in every pool first, then this);
# periodZone (below) is the gateways' periodZone, stated in each snapshot,
# which a gateway of another zone refuses.
lease: 4h

# The config: the GitOps repository's directory of golem CRD YAML, kept
# checked out by git-sync beside golem-control (ADR 0054: each push is a
# new worktree, compiled and published within a step; its commit is each
# snapshot's configRevision).
config:
  repo: ""         # required: e.g. git@github.com:corp/golem-config.git
  ref: main
  path: ""         # the directory within the repository; "" its root
  period: 30s
  # How long ago git-sync may have last fetched before golem-control stops
  # renewing leases (-max-config-age): a stalled checkout may miss a
  # restriction merged since, so the gateways' leases run out rather than
  # serve it. Far above period; alert well before it (operations.md,
  # Alerts: golem.control.config.age).
  maxAge: 30m
  # A Secret with an SSH deploy key (key ssh) and known_hosts.
  sshSecret: golem-config-deploy-key
gitSync:
  image: registry.k8s.io/git-sync/git-sync:v4.4.0

# The control API (golemctl, the console), its Entra registration.
api:
  port: 8443
  entraTenant: ""  # required for the API
  audience: api://golem-control
  drain: 10s

# The jobs registration (Entra group sync), by workload identity.
entraSync:
  clientID: ""
  every: 5m
  maxRemovals: 50

# Known spend (ADR 0048): the ledger's ClickHouse, read-only.
clickhouse:
  url: ""          # empty: snapshots carry no known spend
  user: golem_control
  passwordSecret: {name: golem-clickhouse, key: password}
  # The ledger's DDL (deploy/clickhouse/spend.sql), applied by a Job before
  # each install and upgrade, as an admin user (not golem-control's).
  ddl:
    enabled: false
    image: clickhouse/clickhouse-server:24.8
    host: ""        # the native protocol's host
    port: 9440      # TLS
    secure: true
    user: golem_admin
    passwordSecret: {name: golem-clickhouse-admin, key: password}
spendAllowance: 5m
counterRetention: 6h
periodZone: UTC   # MUST MATCH every gateway pool's periodZone (lease, above)

# The audit archive: an Object Lock bucket in a separate account.
auditArchive: ""
# golem-control's metrics and audit records over OTLP/HTTP: a non-loopback
# collector is reached over TLS (lib/otlp), verified against the system
# roots, or caBundle's (as SSL_CERT_FILE, which then replaces the system
# roots for every TLS client: KMS, S3, Entra and ClickHouse too); "off" for
# none.
telemetry: otel-collector.observability.svc:4318
caBundle:
  configMap: ""    # empty: none (the system roots)
  key: ca.crt

serviceAccount:
  annotations: {}
  #  eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/golem-control

probesPort: 8081

resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {memory: 1Gi}

nodeSelector: {}
tolerations: []
