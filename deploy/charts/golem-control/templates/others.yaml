apiVersion: v1
kind: ServiceAccount
metadata:
  name: golem-control
  labels: {{- include "golem-control.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: golem-control
  labels: {{- include "golem-control.labels" . | nindent 4 }}
spec:
  selector: {{- include "golem-control.selector" . | nindent 4 }}
  ports:
    # Connect over h2c behind the mesh (gRPC, gRPC-Web, HTTP/JSON).
    - {name: api, port: {{ .Values.api.port }}, targetPort: api, appProtocol: kubernetes.io/h2c}
