# One gateway pool at one site (docs/operations.md §1). Every value the
# gateway needs is a flag here; secrets are references, never values.

image:
  repository: ghcr.io/chucklehead-dev/golem-gateway
  tag: ""          # default: the chart's appVersion
  pullPolicy: IfNotPresent

replicas: 3        # across zones (topologySpread below)

# The release gate (cmd/golem-gateway): pool mode exits at start unless
# -accept-unreleased is given, until golem#7's deployment evidence is in
# (provider spending limits, OTLP TLS against the real collector, each
# hop's mTLS owner). That evidence can only be gathered from a deployment,
# so the observe-phase site sets this true, and only with a recorded
# decision (who accepted it, for which site, until when) in its values'
# review. Leave it false everywhere else: the pods then crash-loop with the
# gate's message, which names what is missing.
acceptUnreleased: false

# The pool this release serves and the site it runs at.
pool: internal
site: ""           # required: this site's name (its Valkey's keys and ledger rows)

# The state bucket the pool's snapshots are read from, and the publishing
# keys the gateways trust (a ConfigMap of *.pub files).
bucket: ""         # required: s3://<bucket>/<prefix>
trustedKeys:
  configMap: golem-publishing-keys

# The site's Valkey (ElastiCache): TLS and an ACL user; the password from
# a Secret, as $VALKEY_PASSWORD.
valkey:
  address: ""      # required: host:port
  tls: true
  user: golem-gateway
  passwordSecret: {name: golem-valkey, key: password}

# Entra (users' and services' tokens); empty tenant: golem keys only.
entra:
  tenant: ""
  audience: api://golem

# Telemetry: an OTLP/HTTP collector (the node-local one, ADR 0043).
telemetry: otel-collector.observability.svc:4318

# The emergency denylist, managed outside Argo (docs/operations.md §2).
denylist:
  configMap: golem-emergency-denylist
  key: denylist

# The provider Secrets of the pool's backends, each mounted at
# /var/run/golem/secrets/<name> (a Backend's auth.secretRef names one).
providerSecrets: []
#  - anthropic
#  - openai

# Shutdown: readiness fails for `unready` (the endpoints follow), then the
# calls in flight have `drain` to finish (streams are long).
unready: 20s
drain: 10m

# The floor before authentication (gateway/guard).
guard:
  sourceHeader: ""        # e.g. X-Forwarded-For where the mesh sets one
  # Failed authentications a second each source may make before its
  # further failures are refused limit.source. Empty: 20 with sourceHeader
  # set, else 0 (off): behind the Istio sidecar every caller shares the
  # sidecar's address, so one source's budget would be the whole pod's,
  # and a flood of bad tokens would refuse every other caller's failures
  # with it. Set a number to choose either way.
  authFailures: ""
  maxConns: 8192

maxBody: "33554432"   # quoted: a large number would render as 3.3554432e+07

# Request bodies being read at once, before admission (a stalled upload
# holds its bytes until -max-body's BodyTimeout): the gateway's bytes, and
# each principal's bodies. Past either, limit.concurrency. 0: no bound.
maxReading: "536870912"     # 512 MiB; keep it well under resources.limits.memory
maxReadingPerPrincipal: 8

# The pool's ServiceAccount: the role it assumes (IRSA or Pod Identity)
# reads the bucket, writes its status/, and invokes Bedrock if a backend
# uses it (docs/operations.md, Bedrock).
serviceAccount:
  annotations: {}
  #  eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/golem-gateway-internal

# Who may reach the pool through the mesh (Istio). Empty: no policy made.
authorizationPolicy:
  principals: []
  #  - cluster.local/ns/apps/sa/support-bot

service:
  port: 8080

resources:
  requests: {cpu: 500m, memory: 512Mi}
  limits: {memory: 2Gi}

podAnnotations: {}
nodeSelector: {}
tolerations: []
