# One gateway pool at one site (docs/operations.md §1). Every value the
# gateway needs is a flag here; secrets are references, never values.

image:
  repository: ghcr.io/chucklehead-dev/golem-gateway
  tag: ""          # default: the chart's appVersion
  pullPolicy: IfNotPresent

replicas: 3        # across zones (topologySpread below)

# The release gate (cmd/golem-gateway): pool mode exits at start unless
# -accept-unreleased is given, until golem#7's deployment evidence is in
# (provider spending limits, OTLP TLS against the real collector, each
# hop's mTLS owner). That evidence can only be gathered from a deployment,
# so the observe-phase site sets this true, and only with a recorded
# decision (who accepted it, for which site, until when) in its values'
# review. Leave it false everywhere else: the pods then crash-loop with the
# gate's message, which names what is missing.
acceptUnreleased: false

# The pool this release serves and the site it runs at.
pool: internal
site: ""           # required: this site's name (its Valkey's keys and ledger rows)

# The state bucket the pool's snapshots are read from, and the publishing
# keys the gateways trust (a ConfigMap of *.pub files).
bucket: ""         # required: s3://<bucket>/<prefix>
trustedKeys:
  configMap: golem-publishing-keys

# The site's Valkey (ElastiCache): TLS and an ACL user; the password from
# a Secret, as $VALKEY_PASSWORD.
valkey:
  address: ""      # required: host:port
  tls: true
  user: golem-gateway
  passwordSecret: {name: golem-valkey, key: password}

# MUST MATCH golem-control's chart (its lease and periodZone): set twice,
# once per chart, and nothing but the gateway checks them.
# - maxLease (-max-lease) is the longest authorization lease the gateway
#   trusts: golem-control's lease must not be longer, or every gateway
#   refuses every snapshot ("longer than the longest lease") and serves
#   until the lease it holds runs out. Raise this first, roll the pools,
#   then raise golem-control's lease.
# - periodZone (-period-zone) is the budget periods' time zone: each
#   snapshot states golem-control's, and a gateway of another refuses it,
#   naming both.
maxLease: 4h
periodZone: UTC

# Entra (users' and services' tokens); empty tenant: golem keys only.
entra:
  tenant: ""
  audience: api://golem

# Telemetry (ADR 0043, operations.md "Telemetry transport"). By default a
# collector runs in the gateway's pod (collector, below) and the gateway
# exports to it at 127.0.0.1:4318: loopback, plaintext, the hop inside the
# pod's network namespace. Set telemetry to a host:port only with the
# sidecar off, for a remote collector: the gateway then demands TLS (it
# refuses plaintext to any non-loopback address) and verifies the
# collector against the system roots, or the CA bundle below.
telemetry: ""      # empty: the sidecar's 127.0.0.1:4318 (collector.enabled), else required

# A remote collector's private CA (PEM), for a non-loopback telemetry: the
# distroless image has only the public roots and golem has no CA flag, so
# the bundle is mounted and named by SSL_CERT_FILE. SSL_CERT_FILE replaces
# the system roots for every TLS client in the gateway (providers, Entra,
# S3, Valkey without -valkey-ca): the bundle must hold their roots too.
caBundle:
  configMap: ""    # empty: none (the system roots)
  key: ca.crt

# The pod's collector (ADR 0043's in-pod variant), a native sidecar (an
# init container that keeps running: it starts before the gateway and is
# stopped after it, so the drain's last ledger rows reach it; Kubernetes
# 1.29 or later). Its config is deploy/otel/collector.yaml, not written
# here: the chart renders it as a ConfigMap from its copy at
# files/otel-collector.yaml when that copy is present, and otherwise mounts
# the ConfigMap named here, created from deploy/otel/collector.yaml
# (docs/operations.md, First install). The config reads the env the chart
# sets (OTELCOL_QUEUE_DIR, CLICKHOUSE_ENDPOINT, CLICKHOUSE_USERNAME,
# CLICKHOUSE_PASSWORD, GOLEM_SITE, GOLEM_POOL): keep the names in step.
collector:
  enabled: true
  image: otel/opentelemetry-collector-contrib:0.115.1
  configMap: ""    # empty: <release's name>-collector (golem-gateway-<pool>-collector)
  configKey: collector.yaml
  # The sending queue's file_storage directory (OTELCOL_QUEUE_DIR). The
  # default emptyDir is on the node's disk: it survives the collector's
  # restarts and a ClickHouse outage while the pod lives, not the pod's
  # deletion. Size it for the outage it must ride (about 5 MB/s a site at
  # 2,000 calls a second, divided among the pods). volume replaces the
  # emptyDir with another volume source (an ephemeral PVC).
  queue:
    sizeLimit: 8Gi
    volume: {}     # empty: emptyDir with sizeLimit
  # Where the collector writes the ledger.
  clickhouse:
    endpoint: ""   # required with the collector, e.g. https://clickhouse.golem.svc:8443
    user: golem_ingest
    passwordSecret: {name: golem-clickhouse-ingest, key: password}
  env: []          # more env for the config (name/value or valueFrom)
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# The emergency denylist, managed outside Argo (docs/operations.md §2).
denylist:
  configMap: golem-emergency-denylist
  key: denylist

# The provider Secrets of the pool's backends, each mounted at
# /var/run/golem/secrets/<name> (a Backend's auth.secretRef names one).
providerSecrets: []
#  - anthropic
#  - openai

# Shutdown: readiness fails for `unready` (the endpoints follow), then the
# calls in flight have `drain` to finish (streams are long).
unready: 20s
drain: 10m

# The floor before authentication (gateway/guard).
guard:
  sourceHeader: ""        # e.g. X-Forwarded-For where the mesh sets one
  # Failed authentications a second each source may make before its
  # further failures are refused limit.source. Empty: 20 with sourceHeader
  # set, else 0 (off): behind the Istio sidecar every caller shares the
  # sidecar's address, so one source's budget would be the whole pod's,
  # and a flood of bad tokens would refuse every other caller's failures
  # with it. Set a number to choose either way.
  authFailures: ""
  maxConns: 8192

maxBody: "33554432"   # quoted: a large number would render as 3.3554432e+07

# Request bodies being read at once, before admission (a stalled upload
# holds its bytes until -max-body's BodyTimeout): the gateway's bytes, and
# each principal's bodies. Past either, limit.concurrency. 0: no bound.
maxReading: "536870912"     # 512 MiB; keep it well under resources.limits.memory
maxReadingPerPrincipal: 8

# The pool's ServiceAccount: the role it assumes (IRSA or Pod Identity)
# reads the bucket, writes its status/, and invokes Bedrock if a backend
# uses it (docs/operations.md, Bedrock).
serviceAccount:
  annotations: {}
  #  eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/golem-gateway-internal

# Who may reach the pool through the mesh (Istio). Empty: no policy made.
authorizationPolicy:
  principals: []
  #  - cluster.local/ns/apps/sa/support-bot

service:
  port: 8080

resources:
  requests: {cpu: 500m, memory: 512Mi}
  limits: {memory: 2Gi}

podAnnotations: {}
nodeSelector: {}
tolerations: []
