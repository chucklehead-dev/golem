{{- range list "site" "bucket" }}{{ if not (index $.Values .) }}{{ fail (printf "values.%s is required" .) }}{{ end }}{{ end -}}
{{- if not .Values.valkey.address }}{{ fail "values.valkey.address is required" }}{{ end -}}
{{- if .Values.collector.enabled }}
{{- if .Values.telemetry }}{{ fail "values.telemetry is a remote collector's address: set it with collector.enabled=false, or leave it empty for the pod's collector (127.0.0.1:4318)" }}{{ end -}}
{{- if not .Values.collector.clickhouse.endpoint }}{{ fail "values.collector.clickhouse.endpoint is required with the pod's collector (collector.enabled): where it writes the ledger" }}{{ end -}}
{{- else if not .Values.telemetry }}{{ fail "values.telemetry is required with collector.enabled=false: the remote collector's OTLP/HTTP host:port (over TLS), or off" }}{{ end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "golem-gateway.name" . }}
  labels: {{- include "golem-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "golem-gateway.selector" . | nindent 6 }}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {{- include "golem-gateway.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "golem-gateway.name" . }}
      # Past the readiness window and the drain: the kubelet must not kill
      # a stream the drain is waiting for.
      terminationGracePeriodSeconds: {{ add (include "golem-gateway.seconds" .Values.drain) (include "golem-gateway.seconds" .Values.unready) 30 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "golem-gateway.selector" . | nindent 14 }}
      {{- if .Values.collector.enabled }}
      # The pod's collector (ADR 0043): a native sidecar, started before
      # the gateway and stopped after it, so the rows the drain writes
      # reach its queue.
      initContainers:
        - name: collector
          image: {{ .Values.collector.image }}
          restartPolicy: Always
          args: [--config=/etc/otelcol/{{ .Values.collector.configKey }}]
          env:
            - {name: OTELCOL_QUEUE_DIR, value: /var/lib/otelcol/queue}
            - {name: CLICKHOUSE_ENDPOINT, value: {{ .Values.collector.clickhouse.endpoint | quote }}}
            - {name: CLICKHOUSE_USERNAME, value: {{ .Values.collector.clickhouse.user | quote }}}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.collector.clickhouse.passwordSecret.name }}, key: {{ .Values.collector.clickhouse.passwordSecret.key }}}
            - {name: GOLEM_SITE, value: {{ .Values.site | quote }}}
            - {name: GOLEM_POOL, value: {{ .Values.pool | quote }}}
            {{- with .Values.collector.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .Values.collector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: collector-config, mountPath: /etc/otelcol, readOnly: true}
            - {name: collector-queue, mountPath: /var/lib/otelcol/queue}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -listen=:{{ .Values.service.port }}
            - -pool={{ .Values.pool }}
            - -site={{ .Values.site }}
            - -bucket={{ .Values.bucket }}
            - -keys=/etc/golem/keys
            - -checkpoint=/var/lib/golem/checkpoint
            - -secrets=/var/run/golem/secrets
            - -valkey={{ .Values.valkey.address }}
            {{- if .Values.valkey.tls }}
            - -valkey-tls
            {{- end }}
            {{- with .Values.valkey.user }}
            - -valkey-user={{ . }}
            {{- end }}
            {{- with .Values.entra.tenant }}
            - -entra-tenant={{ . }}
            - -entra-audience={{ $.Values.entra.audience }}
            {{- end }}
            - -telemetry={{ include "golem-gateway.telemetry" . }}
            - -denylist=/etc/golem/denylist/{{ .Values.denylist.key }}
            - -unready={{ .Values.unready }}
            - -drain={{ .Values.drain }}
            # Both as golem-control's chart's lease and periodZone (values.yaml).
            - -max-lease={{ .Values.maxLease }}
            - -period-zone={{ .Values.periodZone }}
            - -max-body={{ .Values.maxBody }}
            - -max-reading={{ .Values.maxReading }}
            - -max-reading-per-principal={{ .Values.maxReadingPerPrincipal }}
            {{- $authFailures := .Values.guard.authFailures }}
            {{- if eq (toString $authFailures) "" }}
            {{- $authFailures = ternary 20 0 (ne (toString .Values.guard.sourceHeader) "") }}
            {{- end }}
            - -auth-failures={{ $authFailures }}
            - -max-conns={{ .Values.guard.maxConns }}
            {{- with .Values.guard.sourceHeader }}
            - -source-header={{ . }}
            {{- end }}
            {{- if .Values.acceptUnreleased }}
            # The observe-phase site's recorded decision (values.yaml).
            - -accept-unreleased
            {{- end }}
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.valkey.passwordSecret.name }}, key: {{ .Values.valkey.passwordSecret.key }}}
            {{- if .Values.caBundle.configMap }}
            - {name: SSL_CERT_FILE, value: /etc/golem/ca/{{ .Values.caBundle.key }}}
            {{- end }}
          ports:
            - {name: http, containerPort: {{ .Values.service.port }}}
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: keys, mountPath: /etc/golem/keys, readOnly: true}
            - {name: denylist, mountPath: /etc/golem/denylist, readOnly: true}
            # The checkpoint: the floor across a container's restarts. A
            # rescheduled pod starts from the bucket's trusted checkpoint.
            - {name: checkpoint, mountPath: /var/lib/golem}
            {{- if .Values.caBundle.configMap }}
            - {name: ca, mountPath: /etc/golem/ca, readOnly: true}
            {{- end }}
            {{- range .Values.providerSecrets }}
            - {name: secret-{{ . }}, mountPath: /var/run/golem/secrets/{{ . }}, readOnly: true}
            {{- end }}
      volumes:
        - name: keys
          configMap: {name: {{ .Values.trustedKeys.configMap }}}
        - name: denylist
          configMap: {name: {{ .Values.denylist.configMap }}, optional: false}
        - name: checkpoint
          emptyDir: {}
        {{- if .Values.caBundle.configMap }}
        - name: ca
          configMap: {name: {{ .Values.caBundle.configMap }}}
        {{- end }}
        {{- if .Values.collector.enabled }}
        - name: collector-config
          configMap: {name: {{ include "golem-gateway.collectorConfigMap" . }}}
        - name: collector-queue
          {{- with .Values.collector.queue.volume }}
          {{- toYaml . | nindent 10 }}
          {{- else }}
          emptyDir: {sizeLimit: {{ .Values.collector.queue.sizeLimit }}}
          {{- end }}
        {{- end }}
        {{- range .Values.providerSecrets }}
        - name: secret-{{ . }}
          secret: {secretName: {{ . }}}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
