# The ledger's collector (ADR 0043, operations.md "The ledger's collector"):
# an OpenTelemetry Collector (contrib distribution, 0.163.2: the version
# test/ledger runs this file on) beside the gateway, in its pod or on its
# node. It takes the gateway's OTLP/HTTP on loopback, keeps the golem.spend
# records (the ledger's rows, contracts.md §3.1) in a pipeline of their own,
# queues them on node-local disk, and writes them to ClickHouse, retrying
# until ClickHouse takes them. deploy/clickhouse/spend.sql's views turn
# them into golem.spend's rows.
#
# Run with this file alone (the ledger only), or with forward.yaml after it
# (--config ledger.yaml --config forward.yaml) to send the gateway's spans,
# metrics and other logs on to the enterprise collector.
#
# Environment:
#   GOLEM_CLICKHOUSE_ENDPOINT  required: tcp://host:9000, or https://host:8443
#                              (clickhouse-go's DSN forms; ?secure=true for
#                              TLS over the native protocol)
#   GOLEM_CLICKHOUSE_USER      default "default"
#   GOLEM_CLICKHOUSE_PASSWORD  a secret's; default empty
#   GOLEM_CLICKHOUSE_DATABASE  default golem (the DDL's)
#   GOLEM_LEDGER_QUEUE_DIR     the persistent queue's directory, on node-local
#                              disk, writable by the collector's user (10001 in
#                              the contrib image): a hostPath outlives the pod,
#                              an emptyDir only a container restart; default
#                              /var/lib/golem/otelcol
#   GOLEM_OTLP_LISTEN          the receiver's address; default 127.0.0.1:4318,
#                              the gateway's -telemetry (plaintext only to
#                              a literal loopback address, lib/otlp)
#   GOLEM_OTEL_HEALTH_LISTEN   the health check's; default 0.0.0.0:13133

extensions:
  file_storage/ledger:
    directory: ${env:GOLEM_LEDGER_QUEUE_DIR:-/var/lib/golem/otelcol}
    create_directory: true
    # Each queue write is synced: a crash of the node then loses nothing
    # acknowledged to the gateway. The writes are batches, a few a second.
    fsync: true
  # For the kubelet's probes (GET /), which come to the pod's address.
  health_check:
    endpoint: ${env:GOLEM_OTEL_HEALTH_LISTEN:-0.0.0.0:13133}

receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:GOLEM_OTLP_LISTEN:-127.0.0.1:4318}

processors:
  # The ledger's pipeline carries golem.spend records alone: every other
  # record (golem-control's audit, any other log) is dropped here, and
  # forwarded by forward.yaml's pipeline if that file is loaded.
  filter/ledger:
    error_mode: propagate
    logs:
      log_record:
        - 'log.event_name != "golem.spend"'

exporters:
  clickhouse/ledger:
    endpoint: ${env:GOLEM_CLICKHOUSE_ENDPOINT}
    username: ${env:GOLEM_CLICKHOUSE_USER:-default}
    password: ${env:GOLEM_CLICKHOUSE_PASSWORD:-}
    database: ${env:GOLEM_CLICKHOUSE_DATABASE:-golem}
    # The landing table spend.sql creates (and its views read): the
    # exporter must not create its own.
    logs_table_name: spend_otlp
    create_schema: false
    timeout: 10s
    # Billing rows are never given up on: retried until ClickHouse takes
    # them, the queue holding the rest meanwhile. A row ClickHouse cannot
    # convert does not fail its batch (spend.sql's golem.spend_rejected).
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0
    sending_queue:
      enabled: true
      storage: file_storage/ledger
      num_consumers: 2
      # Requests (the gateway's exports, up to 512 rows each): about
      # 25 million rows, hours of a site's rows, a few GB on disk.
      queue_size: 50000
      # Batched after the persistent queue, so the batching holds no
      # acknowledged row in memory alone.
      batch:
        flush_timeout: 1s
        min_size: 5000
        max_size: 20000

service:
  extensions: [file_storage/ledger, health_check]
  pipelines:
    logs/ledger:
      receivers: [otlp]
      processors: [filter/ledger]
      exporters: [clickhouse/ledger]
