# Everything but the ledger, forwarded: loaded after collector.yaml
# (--config collector.yaml --config forward.yaml), it replaces the "other"
# pipelines' nop exporter with the enterprise collector (ADR 0015), over
# OTLP/HTTP with the exporter's in-memory queue: spans, metrics and log
# records that are not golem.spend rows are not billing data. The ledger's
# pipeline is unchanged.
#
# Environment:
#   GOLEM_OTEL_UPSTREAM_ENDPOINT  required: the enterprise collector's base
#                                 URL, https://collector.example:4318
#                                 (the exporter adds /v1/traces, ...)
#   GOLEM_SITE, GOLEM_POOL        the gateway chart's: added to what is
#                                 forwarded as golem.site and golem.pool

processors:
  batch/forward: {}
  resource/forward:
    attributes:
      - {key: golem.site, value: "${env:GOLEM_SITE}", action: upsert}
      - {key: golem.pool, value: "${env:GOLEM_POOL}", action: upsert}

exporters:
  otlphttp/upstream:
    endpoint: ${env:GOLEM_OTEL_UPSTREAM_ENDPOINT}
    compression: gzip

service:
  pipelines:
    logs/other:
      receivers: [otlp]
      processors: [filter/not-ledger, resource/forward, batch/forward]
      exporters: [otlphttp/upstream]
    traces/other:
      receivers: [otlp]
      processors: [resource/forward, batch/forward]
      exporters: [otlphttp/upstream]
    metrics/other:
      receivers: [otlp]
      processors: [resource/forward, batch/forward]
      exporters: [otlphttp/upstream]
