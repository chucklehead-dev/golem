name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8.1
        ports: ["6379:6379"]
      # The ledger's DDL and the known-spend query run on a real ClickHouse
      # (control/spend's TestClickHouseLedger).
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_USER: golem
          CLICKHOUSE_PASSWORD: ci-only
    env:
      GOLEM_VALKEY_ADDR: localhost:6379
      GOLEM_CLICKHOUSE_URL: http://localhost:8123
      GOLEM_CLICKHOUSE_USER: golem
      GOLEM_CLICKHOUSE_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: wait for ClickHouse
        run: for i in $(seq 60); do curl -fs localhost:8123/ping && exit 0; sleep 1; done; exit 1
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: test (race, shuffled)
        run: go test -race -shuffle=on ./...
      - name: benchmarks compile and run once
        run: go test -run='^$' -bench=. -benchtime=1x ./...
      - name: the example config validates
        run: go run ./cmd/golemctl config validate --standalone examples/standalone
      - name: fuzz smoke
        run: ci/fuzz-smoke.sh
        env:
          FUZZTIME: 10s

  models:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8.1
        ports: ["6379:6379"]
    env:
      GOLEM_VALKEY_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install quint, lmt and gotogether
        run: |
          npm install --global @informalsystems/quint@0.33.1
          go install github.com/driusan/lmt@v0.0.0-20210421124901-62fe18f2f6a6
          go install github.com/chucklehead-dev/gotogether/cmd/gotogether@v0.0.0-20261115081345-fcee5dc84dd1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: the generated models match the markdown
        run: make -C model verify-tangled
      - name: check the models
        run: make -C model check
        env:
          QUINT_BACKEND: typescript
      - name: the design matrices in the model documents are the models'
        run: git diff --exit-code -- model/*.md
      - name: "the gateway against its models (connect: the model drives)"
        run: go test -count=1 -run 'TestPublicationModel|TestExposureModel|TestAttemptsModel' ./gateway/... ./control/...   # TestExposureModelValkey too
        env:
          QUINT_BACKEND: typescript
      # The Hegel machines sit in the packages they test, behind the hegel
      # build tag (the go job's plain go test never compiles them, nor needs
      # libhegel): vet them here, then run them.
      - name: vet with the hegel tag
        run: go vet -tags hegel ./...
      - name: "the gateway against its models (qhegel: Hegel drives, the model judges; planted bugs caught)"
        # The Hegel tests alone: the rest of gateway/... ran in the go job.
        run: go test -count=1 -timeout 20m -tags hegel -run 'AgainstExposureModel|NoScopeLimitCaught|StaleViewDuringOutage|AgainstPublicationModel|NoFloorCaught|NoExpiryCaught' ./gateway/limit/ ./gateway/snapshot/
        env:
          QUINT_BACKEND: typescript

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install the SDKs
        run: |
          python -m pip install -r test/compat/clients/requirements.txt
          npm install --prefix test/compat/clients
      - name: the official SDKs through the gateway
        run: go test -count=1 -v ./test/compat/
        env:
          GOLEM_COMPAT_PYTHON: python
          GOLEM_COMPAT_NODE_MODULES: ${{ github.workspace }}/test/compat/clients/node_modules
