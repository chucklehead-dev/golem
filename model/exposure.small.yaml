# exposure.md's small instance, explored exhaustively (check-exposure.sh):
# two principals (p1 with two calls, p2 with one), two gateways, costs 1 or
# 3, a budget of 2, one call in flight per principal and per scope.
spec: exposure.qnt
module: exposure
constants:
  REQUESTS: 'Set("a1", "a2", "b1")'
  OWNER: 'Map("a1" -> "p1", "a2" -> "p1", "b1" -> "p2")'
  GATEWAYS: 'Set("g1", "g2")'
  COSTS: 'Set(1, 3)'
  WORST: '3'
  BUDGET: '2'
  LIMIT: '1'
  SCOPE_LIMIT: '1'
  SCOPE_LIMIT_ON: 'true'
  HANDOFF: '"byEvent"'
  HOLD_ON_CANCEL: 'true'
  REACQUIRE: 'true'
actions: {}
invariants: [safe, limitsHonoured, withinBound, knownNeverOver, noLostIncrements]
