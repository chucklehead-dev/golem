# This file exists only to name the attempts model's invariants (the
# conjuncts of its safe val) for `gotogether invariants` (model/invariants.sh):
# no test validates runs with it. TestAttemptsModel builds its own binding.
format: gotogether.binding/2
spec: attempts.qnt
module: attempts
invariants: [oneCommit, ledgerMatches, covered, withinBound, workWithinLimit, quotaHonoured, attemptsBounded, retriesCapped, probeOnly]
