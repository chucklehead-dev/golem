# freshness.md's small instance, explored exhaustively to a depth
# (check-freshness.sh): two replicas, one gateway, one right, a lease of 2.
spec: freshness.qnt
module: small
actions: {}
invariants: [safe, restrictionsBounded, noConfigRollback, restoreNeverWidens]
simulate:
  holds: [safe, restrictionsBounded, noConfigRollback, restoreNeverWidens]
  search: {depth: 7, states: 300000}
  variants:
    - name: design
    - name: anchor latest
      constants: {ANCHOR_EARLIEST: 'false'}
      holds: [noConfigRollback, restoreNeverWidens]
      allows: [safe, restrictionsBounded]
    - name: fence one
      constants: {FENCE_BOTH: 'false'}
      holds: [restrictionsBounded, restoreNeverWidens]
      allows: [safe, noConfigRollback]
    - name: restore replaces
      constants: {PRESERVE_ON_RESTORE: 'false'}
      holds: [restrictionsBounded, noConfigRollback]
      allows: [safe, restoreNeverWidens]
