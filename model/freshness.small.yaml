# freshness.md's small instance, explored exhaustively to a depth
# (check-freshness.sh): two replicas, one gateway, one right, a lease of 2.
spec: freshness.qnt
module: freshness
constants:
  REPLICAS: 'Set("r1", "r2")'
  GATEWAYS: 'Set("g1")'
  RIGHTS: 'Set("a")'
  LEASE: '2'
  MAX_TIME: '4'
  CONFIG_FRESH: 'true'
  ANCHOR_EARLIEST: 'true'
  FENCE_BOTH: 'true'
  PRESERVE_ON_RESTORE: 'true'
actions: {}
invariants: [safe, restrictionsBounded, noConfigRollback, restoreNeverWidens]
