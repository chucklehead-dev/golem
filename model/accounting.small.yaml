# accounting.md's small instance, explored exhaustively (check-accounting.sh):
# three requests, costs 1 or 3, a budget of 2, one call in flight.
spec: accounting.qnt
module: accounting
constants:
  REQUESTS: 'Set("r1", "r2", "r3")'
  COSTS: 'Set(1, 3)'
  WORST: '3'
  BUDGET: '2'
  LIMIT: '1'
  LIMIT_ON: 'true'
  RENEW_SLOTS: 'true'
  WORST_CHECK: 'false'
  DEDUP: 'true'
  RECONCILE: 'true'
actions: {}
invariants: [safe, withinBound, noDoubleCount, booksMatch]
