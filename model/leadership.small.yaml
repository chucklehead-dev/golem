# leadership.md's small instance, explored exhaustively to a depth
# (check-leadership.sh): two replicas, a directory of three values. Each
# variant is a design under a rollback or an attack, holding to its depth,
# or a mechanism removed, searched just past its counterexample (a common
# depth of 10 would store about 7 GiB of graph). A broken design lists
# exactly what it breaks: safe is their conjunction.
spec: leadership.qnt
module: small
actions: {}
invariants: [safe, floorNeverDrops, noStaleSync, epochsUnique, noInflation, forward]
simulate:
  holds: [safe, floorNeverDrops, noStaleSync, epochsUnique, noInflation, forward]
  search: {depth: 9, states: 3000000}
  variants:
    - name: lease object, rollback none
      constants: {ROLLBACK: '"none"'}
    - name: lease object, rollback doc
      constants: {ROLLBACK: '"doc"'}
    - name: lease object, rollback lead
      constants: {ROLLBACK: '"lead"'}
    - name: lease object, checkpoint attack, rollback doc
      constants: {CP_ATTACK: 'true', ROLLBACK: '"doc"'}
      search: {depth: 8, states: 3000000}
    - name: lease object, checkpoint attack, rollback lead
      constants: {CP_ATTACK: 'true', ROLLBACK: '"lead"'}
      search: {depth: 8, states: 3000000}
    - name: lease object, restore preserves
      constants: {RESTORE: '"preserve"'}
      search: {depth: 8, states: 3000000}
    - name: lease object, lost replies
      constants: {LOST_REPLY: 'true'}
      search: {depth: 8, states: 3000000}
    - name: lease object, no jobs
      constants: {JOBS: '"none"'}
      search: {depth: 8, states: 3000000}
      holds: [floorNeverDrops, epochsUnique, noInflation, forward]
      allows: [safe, noStaleSync]
    - name: lease object, jobs on the lease read
      constants: {JOBS: '"readLease"'}
      holds: [floorNeverDrops, epochsUnique, noInflation, forward]
      allows: [safe, noStaleSync]
    - name: lease object, no guard
      constants: {GUARD: 'false', ROLLBACK: '"doc"'}
      search: {depth: 6, states: 3000000}
      holds: [noStaleSync, epochsUnique, noInflation, forward]
      allows: [safe, floorNeverDrops]
    - name: lease object, unverified checkpoint
      constants: {CP_ATTACK: 'true', VERIFY: 'false'}
      search: {depth: 4, states: 3000000}
      holds: [floorNeverDrops, noStaleSync, epochsUnique, forward]
      allows: [safe, noInflation]
    - name: lease object, both rolled back
      constants: {ROLLBACK: '"both"'}
      search: {depth: 8, states: 3000000}
      holds: [floorNeverDrops, noStaleSync, noInflation, forward]
      allows: [safe, epochsUnique]
    - name: lead object, rollback none
      constants: {DESIGN: '"object"', ROLLBACK: '"none"'}
    - name: lead object, rollback doc
      constants: {DESIGN: '"object"', ROLLBACK: '"doc"'}
    - name: lead object, lead rolled back
      constants: {DESIGN: '"object"', ROLLBACK: '"lead"'}
      search: {depth: 5, states: 3000000}
      holds: [floorNeverDrops, noStaleSync, noInflation, forward]
      allows: [safe, epochsUnique]
    - name: lead object, jobs before the claim
      constants: {DESIGN: '"object"', JOBS_AFTER_CLAIM: 'false'}
      search: {depth: 8, states: 3000000}
      holds: [floorNeverDrops, epochsUnique, noInflation, forward]
      allows: [safe, noStaleSync]
    - name: hybrid, rollback none
      constants: {DESIGN: '"hybrid"', ROLLBACK: '"none"'}
    - name: hybrid, rollback doc
      constants: {DESIGN: '"hybrid"', ROLLBACK: '"doc"'}
    - name: hybrid, rollback lead
      constants: {DESIGN: '"hybrid"', ROLLBACK: '"lead"'}
    - name: hybrid, checkpoint attack, rollback lead
      constants: {DESIGN: '"hybrid"', CP_ATTACK: 'true', ROLLBACK: '"lead"'}
      search: {depth: 8, states: 3000000}
    - name: hybrid, checkpoint attack, rollback doc
      constants: {DESIGN: '"hybrid"', CP_ATTACK: 'true', ROLLBACK: '"doc"'}
      search: {depth: 8, states: 3000000}
    - name: hybrid, lost replies
      constants: {DESIGN: '"hybrid"', LOST_REPLY: 'true'}
      search: {depth: 8, states: 3000000}
    - name: hybrid, no jobs
      constants: {DESIGN: '"hybrid"', JOBS: '"none"'}
      search: {depth: 8, states: 3000000}
      holds: [floorNeverDrops, epochsUnique, noInflation, forward]
      allows: [safe, noStaleSync]
    - name: hybrid, no guard
      constants: {DESIGN: '"hybrid"', GUARD: 'false', ROLLBACK: '"lead"'}
      search: {depth: 6, states: 3000000}
      holds: [noStaleSync, epochsUnique, noInflation, forward]
      allows: [safe, floorNeverDrops]
    - name: hybrid, unverified checkpoint
      constants: {DESIGN: '"hybrid"', CP_ATTACK: 'true', VERIFY: 'false'}
      search: {depth: 4, states: 3000000}
      holds: [floorNeverDrops, noStaleSync, epochsUnique, forward]
      allows: [safe, noInflation]
    - name: hybrid, both rolled back
      constants: {DESIGN: '"hybrid"', ROLLBACK: '"both"'}
      search: {depth: 8, states: 3000000}
      holds: [floorNeverDrops, noStaleSync, noInflation, forward]
      allows: [safe, epochsUnique]
    - name: today (document)
      constants: {DESIGN: '"doc"'}
    - name: today, no jobs
      constants: {DESIGN: '"doc"', JOBS: '"none"'}
      search: {depth: 8, states: 3000000}
      holds: [floorNeverDrops, epochsUnique, noInflation, forward]
      allows: [safe, noStaleSync]
    - name: today, no guard
      constants: {DESIGN: '"doc"', GUARD: 'false', ROLLBACK: '"doc"'}
      search: {depth: 6, states: 3000000}
      holds: [noStaleSync, epochsUnique, noInflation, forward]
      allows: [safe, floorNeverDrops]
    - name: today, rolled back
      constants: {DESIGN: '"doc"', ROLLBACK: '"doc"'}
      search: {depth: 5, states: 3000000}
      holds: [floorNeverDrops, noStaleSync, noInflation, forward]
      allows: [safe, epochsUnique]
