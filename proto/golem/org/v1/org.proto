syntax = "proto3";

// The org API (architecture.md §3): scopes, memberships and role
// bindings. Authorization is the service layer's (org-model.md §2). A
// scope's policy (models, budget, limits) is not here: it is config, a
// ScopePolicy CRD changed by a GitOps pull request (ADR 0050).
package golem.org.v1;

option go_package = "github.com/chucklehead-dev/golem/gen/golem/org/v1;orgv1";

service OrgService {
  // Creates a top-level scope: admins. It can call nothing until its
  // ScopePolicy, named by its ID, is in the config.
  rpc CreateScope(CreateScopeRequest) returns (CreateScopeResponse);
  // Adds a member: the scope's managers, or admins. A manager adds a
  // principal that exists or creates a service that uses keys; only an
  // admin creates a principal with an Entra ID (users come from the
  // groups bound to scopes, ADR 0047).
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  // Removes a membership granted in golem, revoking its keys in the scope
  // and its role there unless it is still a member through a bound group:
  // the scope's managers, or admins.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // Binds an Entra group to a scope: its members, transitively, become
  // the scope's members at the next sync. Admins.
  rpc BindGroup(BindGroupRequest) returns (BindGroupResponse);
  // Unbinds a group; the memberships it gave end at the next sync. Admins.
  rpc UnbindGroup(UnbindGroupRequest) returns (UnbindGroupResponse);
  // Makes a principal a manager of a scope: admins.
  rpc BindManager(BindManagerRequest) returns (BindManagerResponse);
  // Who the caller is to golem: anyone signed in.
  rpc Whoami(WhoamiRequest) returns (WhoamiResponse);
  // The scopes the caller may read: its own and those it manages; every
  // scope for admins.
  rpc ListScopes(ListScopesRequest) returns (ListScopesResponse);
  // A scope's members, managers and bound groups: for its members, its
  // managers and admins; not found for anyone else.
  rpc GetScope(GetScopeRequest) returns (GetScopeResponse);
}

message CreateScopeRequest {
  // The scope's ID: its ScopePolicy's name in the config.
  string id = 1;
  reserved 2;
  reserved "policy";
  // Checks the change, its authorization and the store\'s invariants, and
  // writes nothing (golemctl --dry-run).
  bool validate_only = 3;
}

message CreateScopeResponse {}

message Member {
  string id = 1;
  // user or service.
  string kind = 2;
  // The user's Entra object ID, or the service's app ID; empty: keys only.
  string entra = 3;
}

message AddMemberRequest {
  string scope = 1;
  Member member = 2;
  // Checks the change, its authorization and the store\'s invariants, and
  // writes nothing (golemctl --dry-run).
  bool validate_only = 3;
}

message AddMemberResponse {}

message RemoveMemberRequest {
  string scope = 1;
  string principal = 2;
  // Checks the change, its authorization and the store\'s invariants, and
  // writes nothing (golemctl --dry-run).
  bool validate_only = 3;
}

message RemoveMemberResponse {}

message BindManagerRequest {
  string scope = 1;
  string principal = 2;
  // Checks the change, its authorization and the store\'s invariants, and
  // writes nothing (golemctl --dry-run).
  bool validate_only = 3;
}

message BindManagerResponse {}

message BindGroupRequest {
  string scope = 1;
  // The group's object ID in Entra.
  string group = 2;
  // Checks the change, its authorization and the store\'s invariants, and
  // writes nothing (golemctl --dry-run).
  bool validate_only = 3;
}

message BindGroupResponse {}

message UnbindGroupRequest {
  string scope = 1;
  string group = 2;
  // Checks the change, its authorization and the store\'s invariants, and
  // writes nothing (golemctl --dry-run).
  bool validate_only = 3;
}

message UnbindGroupResponse {}

message WhoamiRequest {}

message WhoamiResponse {
  string principal = 1;
  bool admin = 2;
  // user or service; empty for a caller with no principal yet.
  string kind = 3;
  repeated string scopes = 4;
  repeated string manages = 5;
}

message ListScopesRequest {}

message ListScopesResponse {
  repeated string ids = 1;
}

message GetScopeRequest {
  string id = 1;
}

message GetScopeResponse {
  string id = 1;
  reserved 2;
  reserved "policy";
  repeated string members = 3;
  repeated string managers = 4;
  // The Entra groups bound to it (object IDs).
  repeated string groups = 5;
}
